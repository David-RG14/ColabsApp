<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Editar colaborador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="avatar-container">
    <ion-avatar class="avatar-container">
      <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Foto de perfil" />
    </ion-avatar>

    <ion-button class="camera-btn" color="primary" shape="round">
      <ion-icon name="camera-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>

  <div class="margen">
    <h5>Nombre</h5>
    <ion-input fill="outline" placeholder="Ana García"></ion-input>

    <h5>Correo electrónico</h5>
    <ion-input fill="outline" placeholder="ana@empresa.com"></ion-input>

    <h5>Teléfono</h5>
    <ion-input fill="outline" placeholder="+34 600 123 456"></ion-input>

    <h5>Puesto</h5>
    <ion-select fill="outline" placeholder="Desarrolladora">
      <ion-select-option value="puesto1">Gerente</ion-select-option>
      <ion-select-option value="puesto2">Desarrollador</ion-select-option>
      <ion-select-option value="puesto3">Diseñador</ion-select-option>
    </ion-select>

    <h5>Departamento</h5>
    <ion-select fill="outline" placeholder="Desarrollo">
      <ion-select-option value="puesto1">D1</ion-select-option>
      <ion-select-option value="puesto2">D3</ion-select-option>
      <ion-select-option value="puesto3">D3</ion-select-option>
    </ion-select>

    <h5>Fecha de ingreso</h5>
    <ion-input fill="outline" placeholder="12/03/2023"></ion-input>

    <ion-button expand="block" mode="ios" color="primary" class="ion-margin-top ion-margin-bottom"
      style="--border-radius: 12px; height: 50px; font-size: 1.1rem; text-transform: none; margin-top: 40px; --background: #3B82F6;">
      Actualizar
    </ion-button>
  </div>

</ion-content>
